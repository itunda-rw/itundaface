name: Expo Test Lab

on:
  push:
    branches:
      - itundaface-3d-parity
    paths:
      - "expo-test-lab/**"
      - ".github/workflows/expo-test-lab.yml"
  pull_request:
    paths:
      - "expo-test-lab/**"
      - ".github/workflows/expo-test-lab.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-test-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo-test-lab/package.json
      - name: Install dependencies
        run: npm install
      - name: Expo doctor
        run: npx expo-doctor
      - name: Validate Expo config
        run: npx expo config --type public
