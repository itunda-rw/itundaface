name: generate Expo icon assets

on:
  push:
    branches:
      - itundaface-3d-parity
    paths:
      - 'expo-test-lab/assets/itunda-icon.svg'
      - '.github/workflows/generate-expo-icon-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rasterizer
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Generate Expo icon family
        run: |
          python <<'PY'
          import cairosvg
          from PIL import Image
          from pathlib import Path

          d = Path("expo-test-lab/assets")
          src = d / "itunda-icon.svg"
          base_path = d / "itunda-icon.png"

          cairosvg.svg2png(
              url=str(src),
              write_to=str(base_path),
              output_width=1024,
              output_height=1024,
          )

          base = Image.open(base_path).convert("RGBA")

          fg = Image.new("RGBA", (108, 108), (0, 0, 0, 0))
          fg_icon = base.resize((76, 76), Image.Resampling.LANCZOS)
          fg.alpha_composite(fg_icon, (16, 16))
          fg.save(d / "itunda-adaptive-foreground.png", optimize=True)

          alpha = base.getchannel("A")
          mono = Image.new("RGBA", (1024, 1024), (255, 255, 255, 0))
          mono.putalpha(alpha)
          mono.save(d / "itunda-monochrome.png", optimize=True)

          base.resize((64, 64), Image.Resampling.LANCZOS).save(
              d / "itunda-favicon.png", optimize=True
          )
          PY

      - name: Validate generated assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          d = Path("expo-test-lab/assets")
          expected = {
              "itunda-icon.png": (1024, 1024),
              "itunda-adaptive-foreground.png": (108, 108),
              "itunda-monochrome.png": (1024, 1024),
              "itunda-favicon.png": (64, 64),
          }

          for name, size in expected.items():
              path = d / name
              assert path.exists(), f"missing {path}"
              assert Image.open(path).size == size, f"{name}: wrong size"
          print("Itunda icon assets validated.")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expo-test-lab/assets/*.png
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "build: generate Expo native icon assets"
            git push
          fi
