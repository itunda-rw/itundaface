name: Deploy ItundaFace Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare showcase enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('showcase/index.html')
          text = page.read_text(encoding='utf-8')
          for marker in ('<script src="./localization.js"></script>', '<script src="./localization-v2.js"></script>', '<script src="./ux-v2.js"></script>', '<script src="./premium-v3.js"></script>', '<link rel="stylesheet" href="./ux-v2.css">', '<link rel="stylesheet" href="./premium-v3.css">'):
              text = text.replace(marker, '')
          text = text.replace('</head>', '<link rel="stylesheet" href="./ux-v2.css"><link rel="stylesheet" href="./premium-v3.css"></head>')
          text = text.replace('</body>', '<script src="./ux-v2.js"></script><script src="./localization-v2.js"></script><script src="./premium-v3.js"></script></body>')
          page.write_text(text, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './showcase'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
