name: ItundaFace Quality

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical glyph manifest
        run: node scripts/validate-glyph-manifest.mjs
      - name: Validate SVG masters
        run: node scripts/validate-svg-masters.mjs
      - name: Validate font mapping
        run: node scripts/validate-font-mapping.mjs
      - name: Generate color-font manifest
        run: node font/build-manifest.mjs
      - name: Verify generated manifest is clean
        run: git diff --exit-code -- font/build-manifest.json
      - name: Install font compiler
        run: python -m pip install --requirement font/requirements.txt
      - name: Compile SVG-in-OpenType font
        run: node font/compile-color-font.mjs
      - name: Validate generated font tables
        run: python - <<'PY'
          from fontTools.ttLib import TTFont
          font = TTFont('font/dist/ItundaFace-SVG.ttf')
          assert 'SVG ' in font, 'SVG table missing'
          assert 'cmap' in font, 'cmap table missing'
          assert len(font.getBestCmap()) == 5, 'unexpected glyph mapping count'
          print('ItundaFace font validation OK')
          PY
      - name: Upload color font artifact
        uses: actions/upload-artifact@v4
        with:
          name: itundaface-color-font
          path: font/dist/ItundaFace-SVG.ttf
