name: ItundaFace Quality

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate canonical glyph manifest
        run: node scripts/validate-glyph-manifest.mjs
      - name: Validate color-font mapping
        run: node font/build-manifest.mjs
      - name: Verify generated manifest is clean
        run: git diff --exit-code -- font/build-manifest.json
